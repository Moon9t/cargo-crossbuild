[package]
name = "cargo-crossbuild-core"
version = "0.1.0"
edition = "2021"

[dependencies]
toml = "0.8"
semver = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
which = "6"
fs_extra = "1.3"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.5"

[dev-dependencies]
tempfile = "3"
serial_test = "2"