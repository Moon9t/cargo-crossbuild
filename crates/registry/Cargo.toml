crossbuild-provider-msvc = { path = "../providers/msvc", version = "1.0.0" }
crossbuild-provider-sysroot = { path = "../providers/sysroot", version = "1.0.0" }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }