[package]
name = "cargo-crossbuild-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbuild-core = { path = "../core" }
crossbuild-engine = { path = "../engine" }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "cargo-crossbuild"
path = "src/main.rs"