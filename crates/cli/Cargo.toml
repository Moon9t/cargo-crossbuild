[package]
name = "cargo-crossbuild-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI frontend for cargo-crossbuild, the cross-compilation toolchain manager"
keywords.workspace = true
categories.workspace = true

[dependencies]
crossbuild-core = { path = "../core", version = "1.0.0" }
crossbuild-engine = { path = "../engine", version = "1.0.0" }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "cargo-crossbuild"
path = "src/main.rs"